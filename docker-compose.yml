name: traiblazer

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: traiblazer
      POSTGRES_PASSWORD: traiblazer
      POSTGRES_DB: traiblazer
    ports:
      # 5432 is often taken by other local projects; use 5433 on the host.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traiblazer -d traiblazer"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
